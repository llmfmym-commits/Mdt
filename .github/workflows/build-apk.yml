name: Build AllCalc APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------
      # 1. Checkout
      # -------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4


      # -------------------------------------------------
      # 2. Java 21
      # -------------------------------------------------
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # -------------------------------------------------
      # 3. Node
      # -------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # -------------------------------------------------
      # 4. Install npm packages
      # -------------------------------------------------
      - name: Install dependencies
        run: npm install


      # -------------------------------------------------
      # 5. Create Android project
      # -------------------------------------------------
      - name: Add Android
        run: npx cap add android


      # -------------------------------------------------
      # 6. Sync web project
      # -------------------------------------------------
      - name: Sync Capacitor
        run: npx cap sync android


      # -------------------------------------------------
      # 7. Configure Tapsell SDK
      # -------------------------------------------------
      - name: Configure Tapsell
        env:
          TAPSELL_APP_KEY: ${{ secrets.TAPSELL_APP_KEY }}
          TAPSELL_ZONE_ID: ${{ secrets.TAPSELL_ZONE_ID }}

        run: |

          python3 <<'PY'

          import os
          from pathlib import Path

          app_key = os.environ["TAPSELL_APP_KEY"]
          zone_id = os.environ["TAPSELL_ZONE_ID"]

          gradle = Path("android/app/build.gradle")

          text = gradle.read_text()

          # ---------------------------------------------
          # Add BuildConfig values
          # ---------------------------------------------

          build_config = f'''
                  buildConfigField "String", "TAPSELL_APP_KEY", "\\"{app_key}\\"
                  buildConfigField "String", "TAPSELL_ZONE_ID", "\\"{zone_id}\\""
          '''

          if "TAPSELL_APP_KEY" not in text:

              text = text.replace(
                  "defaultConfig {",
                  "defaultConfig {" + build_config,
                  1
              )


          # ---------------------------------------------
          # Add Tapsell dependency
          # ---------------------------------------------

          dependency = """
              implementation 'ir.tapsell.plus:tapsell-plus-sdk-android:2.3.3'
          """

          if "tapsell-plus-sdk-android" not in text:

              text = text.replace(
                  "dependencies {",
                  "dependencies {" + dependency,
                  1
              )


          gradle.write_text(text)

          PY


      # -------------------------------------------------
      # 8. Create Tapsell Capacitor Plugin
      # -------------------------------------------------
      - name: Create Tapsell Java Plugin
        run: |

          mkdir -p android/app/src/main/java/com/allcalc/app


          cat > android/app/src/main/java/com/allcalc/app/TapsellPlugin.java <<'JAVA'

          package com.allcalc.app;

          import androidx.annotation.NonNull;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import ir.tapsell.plus.AdRequestCallback;
          import ir.tapsell.plus.AdShowListener;
          import ir.tapsell.plus.TapsellPlus;
          import ir.tapsell.plus.model.TapsellPlusAdModel;
          import ir.tapsell.plus.model.TapsellPlusErrorModel;


          @CapacitorPlugin(name = "Tapsell")
          public class TapsellPlugin extends Plugin {


              private PluginCall pendingCall;


              @Override
              public void load() {

                  super.load();

                  TapsellPlus.initialize(
                          getContext(),
                          BuildConfig.TAPSELL_APP_KEY,
                          null
                  );
              }


              @com.getcapacitor.PluginMethod
              public void showRewarded(PluginCall call) {

                  pendingCall = call;


                  TapsellPlus.requestRewardedVideoAd(

                          getActivity(),

                          BuildConfig.TAPSELL_ZONE_ID,

                          new AdRequestCallback() {


                              @Override
                              public void response(
                                      TapsellPlusAdModel adModel
                              ) {

                                  String responseId =
                                          adModel.getResponseId();


                                  TapsellPlus.showRewardedVideoAd(

                                          getActivity(),

                                          responseId,

                                          new AdShowListener() {


                                              @Override
                                              public void onOpened(
                                                      TapsellPlusAdModel ad
                                              ) {

                                                  // تبلیغ باز شد
                                              }


                                              @Override
                                              public void onClosed(
                                                      TapsellPlusAdModel ad
                                              ) {

                                                  // تبلیغ بسته شد
                                              }


                                              @Override
                                              public void onRewarded(
                                                      TapsellPlusAdModel ad
                                              ) {

                                                  if (pendingCall != null) {

                                                      JSObject result =
                                                              new JSObject();

                                                      result.put(
                                                              "rewarded",
                                                              true
                                                      );

                                                      pendingCall.resolve(
                                                              result
                                                      );

                                                      pendingCall = null;
                                                  }
                                              }


                                              @Override
                                              public void onError(
                                                      TapsellPlusErrorModel error
                                              ) {

                                                  reject(
                                                          "Tapsell error: "
                                                          + error.toString()
                                                  );
                                              }

                                          }
                                  );
                              }


                              @Override
                              public void error(
                                      @NonNull String message
                              ) {

                                  reject(
                                          "Tapsell request error: "
                                          + message
                                  );
                              }

                          }
                  );
              }


              private void reject(String message) {

                  if (pendingCall != null) {

                      pendingCall.reject(message);

                      pendingCall = null;
                  }
              }

          }

          JAVA


      # -------------------------------------------------
      # 9. Create MainActivity
      # -------------------------------------------------
      - name: Create MainActivity
        run: |

          cat > android/app/src/main/java/com/allcalc/app/MainActivity.java <<'JAVA'

          package com.allcalc.app;

          import android.os.Bundle;

          import com.getcapacitor.BridgeActivity;


          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {

                  registerPlugin(
                          TapsellPlugin.class
                  );

                  super.onCreate(
                          savedInstanceState
                  );
              }
          }

          JAVA


      # -------------------------------------------------
      # 10. Sync again
      # -------------------------------------------------
      - name: Sync Capacitor
        run: npx cap sync android


      # -------------------------------------------------
      # 11. Build APK
      # -------------------------------------------------
      - name: Build Debug APK
        working-directory: android
        run: |

          chmod +x gradlew

          ./gradlew assembleDebug


      # -------------------------------------------------
      # 12. Prepare APK
      # -------------------------------------------------
      - name: Prepare APK
        run: |

          mkdir -p output

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            output/AllCalc-Tapsell.apk


      # -------------------------------------------------
      # 13. Upload APK
      # -------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AllCalc-Tapsell-APK
          path: output/AllCalc-Tapsell.apk
