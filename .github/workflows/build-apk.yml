name: Build AllCalc APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Add Android
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      # -----------------------------------------
      # Tapsell SDK
      # -----------------------------------------
      - name: Add Tapsell SDK
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          dependency = """
              implementation 'ir.tapsell.plus:tapsell-plus-sdk-android:2.3.3'
          """

          if "tapsell-plus-sdk-android" not in text:
              text = text.replace(
                  "dependencies {",
                  "dependencies {" + dependency,
                  1
              )

          path.write_text(text)
          PY

      # -----------------------------------------
      # Create secure Tapsell config
      # -----------------------------------------
      - name: Create Tapsell Config
        env:
          TAPSELL_APP_KEY: ${{ secrets.TAPSELL_APP_KEY }}
          TAPSELL_ZONE_ID: ${{ secrets.TAPSELL_ZONE_ID }}
        run: |

          mkdir -p android/app/src/main/java/com/allcalc/app

          python3 <<'PY'

          import os
          import json
          from pathlib import Path

          app_key = os.environ["TAPSELL_APP_KEY"]
          zone_id = os.environ["TAPSELL_ZONE_ID"]

          app_key_java = json.dumps(
              app_key,
              ensure_ascii=False
          )

          zone_id_java = json.dumps(
              zone_id,
              ensure_ascii=False
          )

          content = f'''package com.allcalc.app;

          public final class TapsellConfig {{

              private TapsellConfig() {{

              }}

              public static final String APP_KEY =
                      {app_key_java};

              public static final String ZONE_ID =
                      {zone_id_java};
          }}
          '''

          Path(
              "android/app/src/main/java/com/allcalc/app/TapsellConfig.java"
          ).write_text(content)

          PY

      # -----------------------------------------
      # Create Capacitor Tapsell Plugin
      # -----------------------------------------
      - name: Create Tapsell Plugin
        run: |

          mkdir -p android/app/src/main/java/com/allcalc/app

          cat > android/app/src/main/java/com/allcalc/app/TapsellPlugin.java <<'JAVA'

          package com.allcalc.app;

          import androidx.annotation.NonNull;

          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import ir.tapsell.plus.AdRequestCallback;
          import ir.tapsell.plus.AdShowListener;
          import ir.tapsell.plus.TapsellPlus;
          import ir.tapsell.plus.model.TapsellPlusAdModel;
          import ir.tapsell.plus.model.TapsellPlusErrorModel;

          @CapacitorPlugin(name = "Tapsell")
          public class TapsellPlugin extends Plugin {

              private PluginCall pendingCall;

              @Override
              public void load() {

                  super.load();

                  TapsellPlus.initialize(
                      getContext(),
                      TapsellConfig.APP_KEY,
                      null
                  );
              }

              @com.getcapacitor.PluginMethod
              public void showRewarded(PluginCall call) {

                  pendingCall = call;

                  TapsellPlus.requestRewardedVideoAd(
                      getActivity(),
                      TapsellConfig.ZONE_ID,
                      new AdRequestCallback() {

                          @Override
                          public void response(
                              TapsellPlusAdModel adModel
                          ) {

                              TapsellPlus.showRewardedVideoAd(
                                  getActivity(),
                                  adModel.getResponseId(),
                                  new AdShowListener() {

                                      @Override
                                      public void onOpened(
                                          TapsellPlusAdModel ad
                                      ) {
                                      }

                                      @Override
                                      public void onClosed(
                                          TapsellPlusAdModel ad
                                      ) {
                                      }

                                      @Override
                                      public void onRewarded(
                                          TapsellPlusAdModel ad
                                      ) {

                                          if (pendingCall != null) {

                                              JSObject result =
                                                  new JSObject();

                                              result.put(
                                                  "rewarded",
                                                  true
                                              );

                                              pendingCall.resolve(
                                                  result
                                              );

                                              pendingCall = null;
                                          }
                                      }

                                      @Override
                                      public void onError(
                                          TapsellPlusErrorModel error
                                      ) {

                                          reject(
                                              error.toString()
                                          );
                                      }
                                  }
                              );
                          }

                          @Override
                          public void error(
                              @NonNull String message
                          ) {

                              reject(message);
                          }
                      }
                  );
              }

              private void reject(String message) {

                  if (pendingCall != null) {

                      pendingCall.reject(message);

                      pendingCall = null;
                  }
              }
          }

          JAVA

      # -----------------------------------------
      # MainActivity
      # -----------------------------------------
      - name: Create MainActivity
        run: |

          cat > android/app/src/main/java/com/allcalc/app/MainActivity.java <<'JAVA'

          package com.allcalc.app;

          import android.os.Bundle;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(
                  Bundle savedInstanceState
              ) {

                  registerPlugin(
                      TapsellPlugin.class
                  );

                  super.onCreate(
                      savedInstanceState
                  );
              }
          }

          JAVA

      # -----------------------------------------
      # Sync
      # -----------------------------------------
      - name: Sync Capacitor
        run: npx cap sync android

      # -----------------------------------------
      # Build APK
      # -----------------------------------------
      - name: Build APK
        working-directory: android
        run: |

          chmod +x gradlew

          ./gradlew assembleDebug

      # -----------------------------------------
      # Prepare APK
      # -----------------------------------------
      - name: Prepare APK
        run: |

          mkdir -p output

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            output/AllCalc-Tapsell.apk

      # -----------------------------------------
      # Upload APK
      # -----------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AllCalc-Tapsell-APK
          path: output/AllCalc-Tapsell.apk
